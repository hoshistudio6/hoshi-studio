<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoshi Studio — Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#161616;font:14px Arial,sans-serif}header{height:72px;background:#111;color:white;padding:0 max(22px,5vw);display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px}button{border:0;border-radius:7px;padding:10px 14px;background:#111;color:white;font-weight:700;cursor:pointer}.light{background:white;color:#111}.danger{background:none;color:#d00018;padding:3px}main{max-width:1120px;margin:auto;padding:48px 22px}h1{font-size:42px;margin:0 0 28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px}.stat{background:#ffe6e9;padding:20px;border-radius:12px}.stat span{display:block;color:#777;font-size:12px}.stat strong{display:block;font-size:30px;margin-top:10px}.panel{background:white;border:1px solid #eee;border-radius:12px;padding:22px;margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}h2{margin:0;font-size:23px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee}th{font-size:11px;color:#777;text-transform:uppercase}.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:9px}.status{background:#ddf0d8;padding:5px 7px;border-radius:4px;font-size:11px}.order{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #eee}.order p{margin:5px 0 0;color:#777;font-size:12px}dialog{border:0;border-radius:14px;width:min(500px,calc(100% - 30px));padding:28px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px;font:14px Arial}.checkbox{display:flex;gap:8px;align-items:center}.checkbox input{width:auto}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}@media(max-width:650px){.stats{grid-template-columns:1fr}.panel{overflow:auto}table{min-width:600px}}</style></head><body><header><strong>Hoshi <span style="color:#e60018">Studio</span></strong><div><a href="/" style="color:white;margin-right:15px">View store</a><button class="light" id="logout">Log out</button></div></header><main><h1>Studio dashboard</h1><section class="stats" id="stats"></section><section class="panel"><div class="head"><h2>Products</h2><button id="add">+ Add product</button></div><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Visible</th><th></th></tr></thead><tbody id="products"></tbody></table></section><section class="panel"><div class="head"><h2>Recent orders</h2></div><div id="orders"></div></section></main><dialog id="dialog"><h2 id="formTitle">Add product</h2><form id="form"><input type="hidden" name="id"><label>Name</label><input name="name" required><label>Category</label><input name="category" required placeholder="Jewellery"><label>Price (₹)</label><input name="price" type="number" min="0" required><label>Image URL</label><input name="image" type="url" required><label>Description</label><textarea name="description" required></textarea><label>Badge</label><input name="badge" value="NEW"><label class="checkbox"><input type="checkbox" name="active" checked> Show in storefront</label><div class="actions"><button type="button" class="light" style="border:1px solid #ddd" id="cancel">Cancel</button><button>Save product</button></div></form></dialog><script>const $=s=>document.querySelector(s);let products=[];const money=n=>'₹'+new Intl.NumberFormat('en-IN').format(n);async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/login.html';return}return r.json()}async function load(){products=await api('/api/admin/products');const orders=await api('/api/admin/orders');$('#stats').innerHTML=`<div class="stat"><span>Products</span><strong>${products.length}</strong></div><div class="stat"><span>Orders</span><strong>${orders.length}</strong></div><div class="stat"><span>Order value</span><strong>${money(orders.reduce((t,o)=>t+o.total,0))}</strong></div>`;$('#products').innerHTML=products.map(p=>`<tr><td><img class="thumb" src="${p.image}"><b>${p.name}</b></td><td>${p.category}</td><td>${money(p.price)}</td><td><span class="status">${p.active?'Live':'Hidden'}</span></td><td><button class="light" style="color:#111;border:1px solid #ddd" onclick="edit('${p.id}')">Edit</button> <button class="danger" onclick="removeProduct('${p.id}')">Delete</button></td></tr>`).join('');$('#orders').innerHTML=orders.length?orders.map(o=>`<div class="order"><div><b>${o.id}</b><p>${o.customer.name} · ${new Date(o.createdAt).toLocaleDateString('en-IN')}</p></div><div><b>${money(o.total)}</b><p>${o.paymentMethod} · ${o.status}</p></div></div>`).join(''):'<p style="color:#777">Orders from your store will appear here.</p>'}function openForm(p){const f=$('#form');f.reset();$('#dialog').showModal();if(p){$('#formTitle').textContent='Edit product';for(const [k,v] of Object.entries(p)){if(f[k])f[k].type==='checkbox'?f[k].checked=v:f[k].value=v}}else{$('#formTitle').textContent='Add product';f.active.checked=true}}$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dialog').close();window.edit=id=>openForm(products.find(p=>p.id===id));window.removeProduct=async id=>{if(confirm('Delete this product?')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}};$('#form').onsubmit=async e=>{e.preventDefault();const f=e.target,b=Object.fromEntries(new FormData(f));b.active=f.active.checked;b.price=Number(b.price);await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('#dialog').close();load()};$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location='/'};load()</script></body></html>
