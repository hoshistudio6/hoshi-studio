<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoshi Studio — Admin login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff1f2;color:#161616;font:15px Arial,sans-serif}.card{width:min(390px,calc(100% - 40px));padding:42px;background:white;border-radius:18px;box-shadow:0 20px 50px #0002}h1{margin:6px 0 24px;font-size:34px}small{color:#e60018;font-weight:700;letter-spacing:1px}label{display:block;font-weight:700;font-size:12px;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin-bottom:16px;font-size:15px}button{width:100%;border:0;background:#e60018;color:white;border-radius:8px;padding:14px;font-weight:700;cursor:pointer}.error{color:#c00;font-size:13px}</style></head><body><main class="card"><small>HOSHI STUDIO</small><h1>Studio login</h1><form id="login"><label>Password</label><input type="password" name="password" required autofocus><button>Open dashboard</button><p class="error" id="error"></p></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})});if(r.ok)location.href='/admin.html';else document.querySelector('#error').textContent='Password is incorrect.'}</script></body></html>
